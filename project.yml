# XcodeGen 工程定义（Windows 上维护源码，CI 上生成 .xcodeproj 并构建）
name: Suishou
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SuishouCore:
    path: Packages/SuishouCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  Suishou:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    dependencies:
      - package: SuishouCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 随手账
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: com.personal.suishou
            CFBundleURLSchemes:
              - suishouzhang
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Suishou
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.suishou
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"

schemes:
  Suishou:
    build:
      targets:
        Suishou: all
    run:
      config: Debug
    archive:
      config: Release
