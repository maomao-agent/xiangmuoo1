# Codemagic：Windows 无 Mac，云端免费 500 分钟/月构建未签名 ipa（PRD §8.1）
workflows:
  suishou-ios:
    name: 随手账 iOS（未签名 ipa）
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: 安装 xcodegen
        script: brew install xcodegen
      - name: 生成 Xcode 工程
        script: xcodegen generate
      - name: 构建（未签名）
        script: |
          set -o pipefail
          xcodebuild -project Suishou.xcodeproj \
            -scheme Suishou \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify
      - name: 打包未签名 ipa
        script: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP" ]; then echo "未找到 .app 产物"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Suishou-unsigned.ipa Payload
          ls -lh Suishou-unsigned.ipa
    artifacts:
      - Suishou-unsigned.ipa
